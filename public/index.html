<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajan 10K — canlı panel</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDF1;--panel:#F6F8FA;--ink:#17202B;--mute:#5B6878;--line:#CBD3DC;--gain:#1C7A58;--loss:#B2372E;--mark:#C98712;--track:#D7DEE5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#131A22;--panel:#1B2430;--ink:#E4E9EF;--mute:#8D9AAA;--line:#2C3847;--gain:#3FBF8F;--loss:#E0645A;--mark:#E7A93A;--track:#263241}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 18px 48px}
.num{font-variant-numeric:tabular-nums}.pos{color:var(--gain)}.neg{color:var(--loss)}
h1{font-size:15px;font-weight:600;margin:0;color:var(--mute)}
.equity{font-size:clamp(48px,14vw,84px);font-weight:800;line-height:1;margin:10px 0 4px;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
.delta{font-size:17px;font-weight:600}.meta{color:var(--mute);font-size:13px;margin-top:6px}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gain)}
.dot.off{background:var(--loss)}
.gauge{margin:28px 0 8px}.track{position:relative;height:14px;background:var(--track);border-radius:7px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--ink);opacity:.85}
.tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--mute)}
.marker{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--mark);border:3px solid var(--bg)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:10px}.gl b{display:block;color:var(--ink);font-size:13px}
section{margin-top:34px}h2{font-size:20px;font-weight:700;margin:0 0 12px;font-variation-settings:"wdth" 108}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.nm{font-weight:700;font-size:16px}.nm small{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
.r{text-align:right}.sub{color:var(--mute);font-size:13px}.big{font-weight:700;font-size:16px}
.log{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.log li{padding:11px 16px;border-top:1px solid var(--line);font-size:14px}.log li:first-child{border-top:0}
.log time{display:block;color:var(--mute);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:6px;border:1px solid currentColor}
.chart{padding:12px 8px 6px;overflow-x:auto}svg{display:block;width:100%;height:auto}
.txt{padding:14px 16px;font-size:14px;color:var(--mute)}.txt p{margin:0 0 8px}.txt p:last-child{margin:0}
a{color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.banner{margin-top:16px;padding:12px 16px;border-radius:10px;border:1px solid var(--mark);font-size:14px}
</style>
</head>
<body>
<main id="app"><p class="meta">Yükleniyor…</p></main>
<script src="config.js"></script>
<script>
const REPO=window.REPO;
const NAME={BTC:'Bitcoin',ETH:'Ethereum'};
const TL=n=>Math.round(n).toLocaleString('tr-TR')+'₺';
const USD=n=>'$'+n.toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>(n>=0?'+':'')+n.toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const cls=n=>n>=0?'pos':'neg';
const when=t=>new Date(t).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=(p,pr)=>{const pnl=p.margin*p.lev*(pr/p.entry-1);return{pnl,value:Math.max(0,p.margin+pnl)}};
let S=null, err='';

function chart(){
  const h=S.history.concat(S.equity!=null?[{t:S.lastRun||Date.now(),eq:S.equity}]:[]);
  const W=640,H=220,pl=8,pr=66,pt=14,pb=26,t0=S.startTime,t1=Math.max(S.endTime,h[h.length-1].t),hi=Math.max(S.target,...h.map(x=>x.eq));
  const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(1-v/hi)*(H-pt-pb);
  const ln=(v,c,l,d)=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" ${d?'stroke-dasharray="4 4"':''}/><text x="${W-pr+6}" y="${y(v)+4}" font-size="11" fill="${c}">${l}</text>`;
  let days='';for(let d=0;d<=7;d++){const t=t0+d*86400e3;days+=`<text x="${x(t)}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="middle">${new Date(t).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</text>`}
  const last=h[h.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bakiye grafiği">${ln(S.target,'var(--gain)','Hedef 20K',1)}${ln(S.startCapital,'var(--mute)','Başlangıç',1)}${ln(0,'var(--loss)','Kapatılma',0)}<polyline points="${h.map(p=>x(p.t)+','+y(p.eq)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(last.t)}" cy="${y(last.eq)}" r="5" fill="var(--mark)"/>${days}</svg>`;
}

function render(){
  const app=document.getElementById('app');
  if(!S){app.innerHTML=`<p class="meta">${esc(err||'Yükleniyor…')}</p>`;return;}
  const eq=S.equity??S.history[S.history.length-1].eq, ch=(eq/S.startCapital-1)*100, g=Math.min(100,Math.max(0,eq/S.target*100));
  const left=Math.max(0,Math.ceil((S.endTime-Date.now())/86400e3));
  const status=S.done==='dead'?'Ajan kapatıldı.':S.done==='win'?'Hedef tuttu, ajan 2 katına çıktı.':S.done==='end'?'Süre doldu.':`Hedefe ${TL(S.target-eq)} kaldı, bitişe ${left} gün.`;
  const ago=S.lastRun?Math.round((Date.now()-S.lastRun)/60000):null;
  const alive=ago!==null&&ago<30;
  const rows=S.positions.map(p=>{const pr=S.prices[p.asset]||p.entry,v=value(p,pr),mv=(pr/p.entry-1)*100;
    return `<div class="row"><div class="nm">${NAME[p.asset]}<small>${p.lev}x long</small></div><div class="big r num ${cls(v.pnl)}">${v.pnl>=0?'+':''}${TL(v.pnl)}</div>
    <div class="sub num">Giriş ${USD(p.entry)}, şimdi ${USD(pr)}</div><div class="sub r num ${cls(mv)}">${pct(mv)}</div>
    <div class="sub num">Stop ${USD(p.stop)}, hedef ${USD(p.target)}</div><div class="sub r num">Teminat ${TL(p.margin)}</div></div>`}).join('');
  const pend=S.pending.map(q=>`<div class="row"><div class="nm">${NAME[q.asset]}<small>alım emri bekliyor</small></div><div class="big r num">${USD(q.trigger)}</div></div>`).join('');
  const logs=[...S.log].reverse().map(l=>`<li><time>${when(l.t)}</time><span class="tag ${/STOP$|SAT|SÜRE/.test(l.type)?'neg':/AL|HEDEF|KÂR/.test(l.type)?'pos':''}">${esc(l.type)}</span>${esc(l.text)}</li>`).join('');
  const gh='https://github.com/'+REPO;
  app.innerHTML=`
  <h1>Ajan 10K, 1 haftada 2 kat ya da kapatılma</h1>
  <div class="equity num">${TL(eq)}</div>
  <div class="delta num ${cls(ch)}">${pct(ch)} başlangıca göre</div>
  <div class="meta">${status}</div>
  <div class="meta live"><span class="dot ${alive?'':'off'}"></span>${ago===null?'Bot henüz çalışmadı':`Bot son çalışma: ${ago} dk önce (${when(S.lastRun)}), toplam ${S.runs} çalışma`}</div>
  ${err?`<div class="banner">${esc(err)}</div>`:''}
  <div class="gauge"><div class="track"><div class="fill" style="width:${g}%"></div><div class="tick" style="left:${S.startCapital/S.target*100}%"></div><div class="marker" style="left:${g}%"></div></div>
  <div class="gl"><div><b>0₺</b>kapatılma</div><div style="text-align:center"><b>10.000₺</b>başlangıç</div><div class="r"><b>20.000₺</b>hedef</div></div></div>
  <section><h2>Pozisyonlar</h2><div class="panel">${rows}${pend}<div class="row"><div class="nm">Nakit<small>2.000₺ dokunulmaz</small></div><div class="big r num">${TL(S.cash)}</div></div></div></section>
  <section><h2>Bakiye yolculuğu</h2><div class="panel chart">${chart()}</div></section>
  <section><h2>Binance fiyatları</h2><div class="panel">
   <div class="row"><div class="nm">Bitcoin</div><div class="big r num">${S.live?USD(S.live.BTC):'…'}</div></div>
   <div class="row"><div class="nm">Ethereum</div><div class="big r num">${S.live?USD(S.live.ETH):'…'}</div></div>
   <div class="row"><div class="nm">Dolar/TL<small>USDT/TRY</small></div><div class="big r num">${S.live?S.live.USDTRY.toLocaleString('tr-TR',{maximumFractionDigits:4}):'…'}</div></div></div></section>
  <section><h2>İşlem günlüğü</h2><div class="panel"><ul class="log">${logs}</ul></div></section>
  <section><h2>Nasıl doğrularım?</h2><div class="panel txt">
   <p>Bot her ~5 dakikada bir GitHub Actions üzerinde çalışır, Binance’in 1 dakikalık fiyat mumlarını çeker ve kuralları uygular. Her çalışmanın kaydı ve çektiği fiyatlar <a href="${gh}/actions" target="_blank" rel="noopener">Actions sayfasında</a>, bakiyenin her değişimi <a href="${gh}/commits/main/data/state.json" target="_blank" rel="noopener">commit geçmişinde</a> zaman damgasıyla duruyor.</p>
   <p>Kurallar <a href="${gh}/blob/main/bot/run.mjs" target="_blank" rel="noopener">bot/run.mjs</a> dosyasında açıkça yazılı: 5x kaldıraç, stop −%4, hedef +%5, kâr +%2’yi geçince stop zirvenin %2,5 altına çekilir, hedefte kâr alınıp %1,5 geri çekilmede yeniden girilir, 2.000₺ hiç kullanılmaz, her işlemde %0,1 komisyon.</p>
  </div></section>
  <p class="meta">Bu bir simülasyondur, gerçek para kullanılmaz ve yatırım tavsiyesi değildir.</p>`;
}
async function load(){
  if(!REPO||REPO.startsWith('KULLANICI')){err='public/config.js içindeki depo adını kendi GitHub depona göre düzenle.';render();return;}
  try{const r=await fetch(`https://raw.githubusercontent.com/${REPO}/main/data/state.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw 0; S=await r.json(); err='';}
  catch(e){err='Durum dosyası okunamadı. Depo herkese açık mı ve adı doğru mu?';}
  render();
}
load(); setInterval(load,60000);
</script>
</body>
</html>
