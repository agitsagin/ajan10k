name: Ajan 10K bot

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub en fazla 5 dakikada bir izin verir; gecikmeler mumlarla telafi edilir
  workflow_dispatch: {}     # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

concurrency:
  group: ajan10k-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Botu çalıştır
        run: node bot/run.mjs
      - name: Durumu kaydet
        run: |
          git config user.name "ajan10k-bot"
          git config user.email "ajan10k-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Bot çalıştı: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
